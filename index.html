<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WASD Multiplayer</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1b1f27;
    --line: #2a2f3a;
    --text: #e7e9ee;
    --muted: #8b93a3;
    --accent: #3ddc97;
    --accent-dim: #2a7a58;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "Consolas", "Menlo", monospace;
  }

  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  #status {
    font-size: 13px;
    color: var(--muted);
  }

  #status .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e05252;
    margin-right: 6px;
  }

  #status.connected .dot {
    background: var(--accent);
  }

  #gameWrap {
    position: relative;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 4px;
    overflow: hidden;
  }

  canvas {
    display: block;
    background:
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(0deg, var(--line) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--panel);
  }

  #hud {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }

  #hud span {
    color: var(--accent);
  }

  #help {
    max-width: 480px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  kbd {
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 1px 6px;
    font-family: inherit;
    color: var(--text);
  }
</style>
</head>
<body>

  <h1>WASD Multiplayer</h1>
  <div id="status"><span class="dot"></span><span id="statusText">connecting…</span></div>

  <div id="gameWrap">
    <canvas id="game" width="800" height="600"></canvas>
    <div id="hud">players online: <span id="playerCount">0</span></div>
  </div>

  <p id="help">Move with <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>. Open this page in two tabs (or send the link to a friend) to see the other player move in real time.</p>

  <!-- Socket.IO client, loaded from the official CDN -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // ------------------------------------------------------------------
    // 1. CONNECT TO YOUR RENDER SERVER
    //    Replace this with your actual Render URL once deployed, e.g.
    //    "https://wasd-multiplayer-server.onrender.com"
    // ------------------------------------------------------------------
    const SERVER_URL = "https://wasd-multiplayer-server.onrender.com/";

    const socket = io(SERVER_URL);

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const playerCountEl = document.getElementById("playerCount");

    let myId = null;
    let players = {};       // authoritative-ish state of everyone, keyed by socket id
    let world = { width: 800, height: 600, radius: 16 };

    const SPEED = 3.5; // pixels per frame
    const keys = { w: false, a: false, s: false, d: false };

    // ------------------------------------------------------------------
    // 2. CONNECTION EVENTS
    // ------------------------------------------------------------------
    socket.on("connect", () => {
      statusEl.classList.add("connected");
      statusText.textContent = "connected";
    });

    socket.on("disconnect", () => {
      statusEl.classList.remove("connected");
      statusText.textContent = "disconnected — reconnecting…";
    });

    // Server sends the full current state when we first join
    socket.on("init", (data) => {
      myId = data.id;
      players = data.players;
      world = data.world;
      updateCount();
    });

    // Someone else joined
    socket.on("playerJoined", ({ id, player }) => {
      players[id] = player;
      updateCount();
    });

    // Someone else moved
    socket.on("playerMoved", ({ id, x, y }) => {
      if (players[id]) {
        players[id].x = x;
        players[id].y = y;
      }
    });

    // Someone left
    socket.on("playerLeft", (id) => {
      delete players[id];
      updateCount();
    });

    function updateCount() {
      playerCountEl.textContent = Object.keys(players).length;
    }

    // ------------------------------------------------------------------
    // 3. INPUT HANDLING
    // ------------------------------------------------------------------
    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = true;
    });

    window.addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = false;
    });

    // ------------------------------------------------------------------
    // 4. GAME LOOP — move locally, broadcast position, draw everyone
    // ------------------------------------------------------------------
    let lastSent = { x: null, y: null };

    function update() {
      const me = players[myId];
      if (me) {
        let dx = 0, dy = 0;
        if (keys.w) dy -= 1;
        if (keys.s) dy += 1;
        if (keys.a) dx -= 1;
        if (keys.d) dx += 1;

        // normalize diagonal movement so it isn't faster than straight movement
        if (dx !== 0 && dy !== 0) {
          const len = Math.sqrt(2);
          dx /= len;
          dy /= len;
        }

        me.x = Math.max(world.radius, Math.min(world.width - world.radius, me.x + dx * SPEED));
        me.y = Math.max(world.radius, Math.min(world.height - world.radius, me.y + dy * SPEED));

        if (me.x !== lastSent.x || me.y !== lastSent.y) {
          socket.emit("move", { x: me.x, y: me.y });
          lastSent = { x: me.x, y: me.y };
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const id in players) {
        const p = players[id];
        const isMe = id === myId;

        ctx.beginPath();
        ctx.arc(p.x, p.y, world.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color || "#3ddc97";
        ctx.fill();

        if (isMe) {
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();
        }

        ctx.fillStyle = "#e7e9ee";
        ctx.font = "11px monospace";
        ctx.textAlign = "center";
        ctx.fillText(isMe ? "you" : id.slice(0, 4), p.x, p.y - world.radius - 6);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
